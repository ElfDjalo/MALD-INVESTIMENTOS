<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Login Administrador</title>
</head>
<body>

    <h2>Login Administrativo</h2>

    <form action="login.php" method="POST">

        <input
            type="text"
            name="username"
            placeholder="Utilizador"
            required>

        <br><br>

        <input
            type="password"
            name="password"
            placeholder="Senha"
            required>

        <br><br>

        <button type="submit">
            Entrar
        </button>

    </form>

</body>
</html>
